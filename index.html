<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Gerard Muarif - Portfolio</title>
    <!-- Google Fonts: Poppins & Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f7f4; /* Light Sage Green Background */
            color: #2d3732;
            line-height: 1.6;
        }

        /* --- NAVBAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            background-color: rgba(240, 247, 244, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #2d6a4f;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #40916c;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #1b4332;
        }

        /* --- SECTION BASE --- */
        section {
            padding: 60px 8%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            text-align: center;
            color: #1b4332;
            margin-bottom: 40px;
            letter-spacing: 1px;
            position: relative;
        }

        .section-subtitle {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #52b788;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* --- HERO / ABOUT SECTION --- */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            min-height: 80vh;
            flex-wrap: wrap;
        }

        .hero-img-container {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            position: relative;
        }

        .hero-img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 15px 15px 0px #b7e4c7;
        }

        .hero-content {
            flex: 1.2;
            min-width: 300px;
        }

        .greeting {
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #52b788;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .hero-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            line-height: 1.2;
            color: #1b4332;
            margin-bottom: 30px;
            border-bottom: 2px solid #d8f3dc;
            padding-bottom: 20px;
        }

        .bio-table {
            width: 100%;
            border-collapse: collapse;
        }

        .bio-table tr {
            border-bottom: 1px solid #d8f3dc;
        }

        .bio-table td {
            padding: 12px 0;
            font-size: 0.95rem;
        }
